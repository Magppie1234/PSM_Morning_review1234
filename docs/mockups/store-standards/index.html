<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Magppie Store Standards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<style>
/* Layout: phone-first single column. Sticky header with wordmark; bottom tab bar on phones, top nav on desktop.
   Magppie palette on an off-white ground; single light theme by choice. */
:root {
  --paper: #F7F4F0;
  --card: #FFFDFA;
  --sand: #C8BFB0;
  --sand-light: #EDE7DD;
  --sand-deep: #B5AA99;
  --stone: #8C8070;
  --ink: #2B2B2B;
  --charcoal: #3A3A3A;
  --soft: #6B645A;
  --rule: #E5DED3;
  --good: #4E6B4A; --good-bg: #E7EDE3;
  --warn: #8F6A2A; --warn-bg: #F5ECD9;
  --bad: #94443A;  --bad-bg: #F4E3DE;
  --idle-bg: #EEE9E1;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r: 12px;
  --shadow: 0 1px 2px rgba(58, 52, 44, 0.04), 0 4px 16px rgba(58, 52, 44, 0.04);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--charcoal); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
a { color: inherit; }
h1, h2, h3 { margin: 0; color: var(--ink); text-wrap: balance; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(30px, 6vw, 40px); line-height: 1.1; letter-spacing: 0.005em; }
h2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; }
h3 { font-size: 15.5px; font-weight: 500; line-height: 1.35; }
p { margin: 0; }
.ic { flex: none; }

.wrap { width: 100%; max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { padding-block: 20px 120px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.tight { gap: 4px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap, .wrap.row { flex-wrap: wrap; }
.gap8 { gap: 8px; }
.between { justify-content: space-between; }
.muted { color: var(--soft); }
.small { font-size: 13px; }
.bad { color: var(--bad) !important; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone); font-weight: 500; }
.req { color: var(--bad); font-size: 13px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(247, 244, 240, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: center; gap: 20px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); min-width: 0; }
.wordmark { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: 0.32em; color: var(--ink); line-height: 1; padding-left: 0.05em; }
.wordmark.sm { font-size: 17px; }
.logo-img { height: 28px; width: auto; display: block; }
.logo-img.sm { height: 24px; }
.brand-sub { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); border-left: 1px solid var(--rule); padding-left: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-top { display: flex; gap: 2px; flex: 1; justify-content: flex-end; }
.nav-top button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--soft); font-size: 14px; }
.nav-top button:hover { color: var(--ink); background: var(--sand-light); }
.nav-top button[aria-current="page"] { color: var(--ink); background: var(--sand-light); }
.nav-top .ic { display: none; }
.who { font-size: 13px; color: var(--soft); white-space: nowrap; }
.nav-bottom { display: none; }
.note-strip { margin-top: 12px; font-size: 13px; color: var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: 8px; }

@media (max-width: 760px) {
  .nav-top, .who { display: none; }
  .nav-bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: rgba(255, 253, 250, 0.97); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid var(--rule); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .nav-bottom button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 6px 2px; border-radius: 10px; cursor: pointer; color: var(--stone); font-size: 11px; }
  .nav-bottom button[aria-current="page"] { color: var(--ink); background: var(--sand-light); }
  .page { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
}

/* Cards */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 20px; }
.band { background: var(--sand-light); border-radius: var(--r); padding: 14px 16px; }
.empty { border: 1px dashed var(--sand-deep); border-radius: var(--r); padding: 28px 16px; text-align: center; color: var(--soft); }
.alert { border-radius: 10px; padding: 12px 16px; background: var(--bad-bg); color: var(--ink); border: 1px solid #EBCFC8; }
.alert.warn { background: var(--warn-bg); border-color: #EBDDBD; }
.alert.good { background: var(--good-bg); border-color: #D2DECC; }
.back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--soft); font-size: 14px; }
.back:hover { color: var(--ink); }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; font-weight: 500; padding: 12px 20px; min-height: 46px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { background: #000; }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--sand-deep); }
.btn.ghost:hover:not(:disabled) { background: var(--sand-light); }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 13.5px; }
.btn.xs { min-height: 30px; padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link.strong { font-weight: 500; text-decoration: none; text-align: left; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; color: var(--soft); flex: none; }
.icon-btn:hover { color: var(--ink); background: var(--sand-light); }
label.f, div.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--soft); min-width: 0; }
input[type=text], input[type=email], input[type=date], input[type=time], select, textarea {
  font-size: 16px; color: var(--ink); background: #fff; border: 1px solid var(--sand-deep); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; min-height: 46px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--stone) 50%), linear-gradient(135deg, var(--stone) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea { min-height: 90px; resize: vertical; }
:focus-visible { outline: 2px solid var(--stone); outline-offset: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--sand-deep); background: #fff; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.seg { display: flex; background: var(--sand-light); border-radius: 10px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--soft); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.small-seg button { padding: 6px 12px; }
.tabs { align-self: flex-start; }
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--soft); }

/* Pills and dots */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.submitted { color: var(--good); background: var(--good-bg); }
.pill.draft, .pill.due { color: var(--warn); background: var(--warn-bg); }
.pill.overdue { color: var(--bad); background: var(--bad-bg); }
.pill.upcoming, .pill.off { color: var(--soft); background: var(--idle-bg); }
.state-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--sand); }
.state-dot.submitted { background: var(--good); }
.state-dot.due, .state-dot.draft { background: #C9A15A; }
.state-dot.overdue { background: var(--bad); }
.state-dot.upcoming, .state-dot.off { background: var(--sand); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.bar { height: 6px; background: var(--sand-light); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .3s ease; }

/* Hero (store home) */
.hero { padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 46px solid var(--stone); opacity: 0.06; top: -150px; right: -110px; pointer-events: none; }
.hero-stats { display: flex; gap: 28px; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats b { font-family: var(--display); font-size: 34px; font-weight: 600; color: var(--ink); line-height: 1; }
.hero-stats span { font-size: 12.5px; color: var(--soft); }
.next { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--ink); color: var(--paper); border: 0; border-radius: 12px; padding: 16px 18px; cursor: pointer; position: relative; z-index: 1; }
.next > span:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.next .eyebrow { color: var(--sand); }
.next-t { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.15; }
.next .small { color: #D9D1C4; }
.next-go { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; }
.all-done { display: flex; align-items: center; gap: 8px; color: var(--good); font-weight: 500; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick-btn { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; cursor: pointer; box-shadow: var(--shadow); color: var(--ink); }
.quick-btn:hover { border-color: var(--sand-deep); }
.quick-btn > span { display: flex; flex-direction: column; gap: 2px; }
.quick-btn b { font-weight: 500; font-size: 14px; line-height: 1.3; }
.quick-btn > span > span { font-size: 12.5px; color: var(--soft); }
@media (max-width: 420px) { .quick { grid-template-columns: 1fr; } }

/* Lists */
.list { overflow: hidden; }
.list-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px 10px; flex-wrap: wrap; }
.due-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 20px; background: none; border: 0; border-top: 1px solid var(--rule); text-align: left; cursor: pointer; color: var(--soft); }
.due-row:hover { background: #FBF8F3; }
.due-row.static { cursor: default; }
.due-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.due-main .t { color: var(--ink); font-weight: 500; }
.due-main .m { font-size: 13px; color: var(--soft); }
.more { width: 100%; padding: 12px; border: 0; border-top: 1px solid var(--rule); background: none; color: var(--soft); cursor: pointer; font-size: 13.5px; }
.more:hover { color: var(--ink); }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); color: var(--soft); font-size: 12.5px; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--sand-deep); }
.tile b { font-family: var(--display); font-size: 34px; font-weight: 600; color: var(--ink); line-height: 1.05; }
.tile b small { font-size: 20px; color: var(--stone); }
@media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } }

/* Tables */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--rule); vertical-align: middle; }
thead th { border-top: 0; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); font-weight: 500; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.matrix th, .matrix td { text-align: center; padding: 8px 6px; }
.matrix th:first-child, .matrix td:first-child { text-align: left; padding-left: 20px; white-space: nowrap; }
.matrix tbody tr:hover { background: #FBF8F3; }
.cell { background: none; border: 0; padding: 8px; cursor: pointer; border-radius: 8px; color: var(--ink); }
.cell:hover { background: var(--sand-light); }

/* Report */
.report-head { display: flex; flex-direction: column; gap: 6px; }
.walk { padding-bottom: 16px; }
.walk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 4px 16px 0; }
.zone { border: 1px dashed var(--sand-deep); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
.zone.has { border-style: solid; border-color: #CFDCC8; background: #FBFDF9; }
.zone-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); font-weight: 500; }
.zone-n { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--good); }
@media (max-width: 520px) { .walk-grid { grid-template-columns: 1fr 1fr; padding: 4px 12px 0; } .zone { padding: 10px; } }
.score-card { display: flex; flex-direction: column; gap: 10px; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-family: var(--display); font-weight: 600; font-size: 54px; line-height: 1; color: var(--ink); }
details summary { cursor: pointer; color: var(--soft); font-size: 13.5px; padding: 4px 0; }
details[open] summary { margin-bottom: 8px; }
.sec { overflow: hidden; }
.sec.complete { border-color: #D2DECC; }
.sec-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 6px; flex-wrap: wrap; }
.items { list-style: none; margin: 0; padding: 0 0 6px; }
.item { border-top: 1px solid var(--rule); padding: 2px 12px 2px 8px; display: flex; flex-wrap: wrap; align-items: center; }
.item:first-child { border-top: 0; }
.tap { display: flex; gap: 14px; align-items: flex-start; padding: 12px; flex: 1; min-width: 0; cursor: pointer; border-radius: 10px; }
.tap:hover { background: #FBF8F3; }
.cb { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border: 1.5px solid var(--sand-deep); border-radius: 8px; background: #fff; display: grid; place-items: center; flex: none; cursor: pointer; transition: background .12s; }
.cb:checked { background: var(--ink); border-color: var(--ink); }
.cb:checked::after { content: ""; width: 6px; height: 12px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.cb:disabled { cursor: default; opacity: .8; }
.txt { color: var(--ink); padding-top: 2px; }
.item.done .txt { color: var(--soft); }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; letter-spacing: 0.04em; color: var(--stone); background: var(--sand-light); border-radius: 999px; padding: 1px 8px; vertical-align: 1px; white-space: nowrap; }
.extra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; padding: 0 12px 12px 52px; }
.item-note { margin-top: 2px; }
.note-btn { background: none; border: 0; color: var(--stone); font-size: 12.5px; cursor: pointer; padding: 8px; white-space: nowrap; }
.note-btn:hover { color: var(--ink); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { position: relative; width: 76px; height: 76px; margin: 0; border-radius: 8px; overflow: hidden; background: var(--sand-light); border: 1px solid var(--rule); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(43,43,43,.78); color: #fff; display: grid; place-items: center; cursor: pointer; }
.thumb-fallback { display: grid; place-items: center; height: 100%; font-size: 12px; color: var(--soft); }
.photo-btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; min-height: 46px; border-radius: 10px; border: 1px solid var(--sand-deep); background: #fff; cursor: pointer; color: var(--ink); font-size: 14px; font-weight: 500; }
.photo-btn.compact { min-height: 38px; padding: 7px 12px; font-size: 13px; }
.photo-btn:hover { background: var(--sand-light); }
.photo-btn[aria-busy="true"] { opacity: .6; }
@media (max-width: 520px) { .extra { padding-left: 12px; } .sec-h, .list-h { padding-left: 16px; padding-right: 16px; } .due-row { padding: 14px 16px; } .pad { padding: 16px; } }

.submit-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 34; background: rgba(255, 253, 250, 0.97); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--rule); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.submit-in { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
.submit-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; max-width: 420px; }
.saving { font-size: 12px; color: var(--soft); }
.submit-err { margin-top: 8px; }
@media (max-width: 760px) {
  .submit-bar { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); padding-bottom: 12px; }
}

/* Email helper */
.email-field { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: #fff; }
.email-field .lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); width: 58px; flex: none; }
.email-field .val { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--ink); font-size: 14px; }
.email-body { white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: var(--ink); background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 14px; max-height: 320px; overflow: auto; }

/* A4 sheet preview */
.sheet-wrap { overflow-x: auto; padding: 4px 2px 8px; }
.sheet { background: #fff; width: 100%; max-width: 720px; margin: 0 auto; aspect-ratio: 210 / 297; min-height: 0; padding: 7% 7.5%; box-shadow: 0 2px 6px rgba(0,0,0,.06), 0 18px 40px rgba(58,52,44,.08); border: 1px solid var(--rule); display: flex; flex-direction: column; gap: 12px; font-size: 12.5px; overflow: hidden; }
@media (max-width: 600px) { .sheet { aspect-ratio: auto; padding: 22px 18px; } }
.sheet-h { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.sheet-tag { display: flex; flex-direction: column; align-items: flex-end; font-size: 9.5px; letter-spacing: 0.12em; color: var(--stone); gap: 2px; }
.sheet-title { font-family: var(--display); font-weight: 500; font-size: 28px; margin-top: 6px; }
.sheet-sub { color: var(--soft); }
.sheet-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sheet-meta span, .cap { display: block; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); }
.sheet-meta b { font-weight: 500; color: var(--ink); font-size: 13px; }
.sheet-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sheet-stats div { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; }
.sheet-stats b { font-family: var(--display); font-size: 24px; font-weight: 600; color: var(--ink); line-height: 1.1; }
.sheet-stats span { font-size: 11px; color: var(--soft); }
.sheet-table { font-size: 12.5px; }
.sheet-table th, .sheet-table td { padding: 5px 4px; }
.st { font-weight: 600; }
.st.good { color: var(--good); } .st.warn { color: var(--warn); } .st.bad { color: var(--bad); }
.sheet-block ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink); }
.sheet-block li { margin: 2px 0; }
.sheet-block p { margin-top: 4px; color: var(--ink); }
.sheet-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.sheet-photos figure { margin: 0; min-width: 0; }
.sheet-photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; background: var(--paper); display: block; }
.sheet-photos figcaption { font-size: 10.5px; color: var(--soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-f { margin-top: auto; border-top: 1px solid var(--rule); padding-top: 8px; font-size: 10px; color: var(--soft); }
@media (max-width: 600px) { .sheet-stats { grid-template-columns: 1fr 1fr; } .sheet-meta { grid-template-columns: 1fr; } }

/* Upkeep */
.upk { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.upk-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.upk-h h3 { font-size: 16.5px; margin-top: 2px; }
.upk-act { display: grid; grid-template-columns: 180px 1fr auto; gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; }
@media (max-width: 600px) { .upk-act { grid-template-columns: 1fr; } }
.timeline { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 2px solid var(--sand-light); font-size: 13px; color: var(--soft); display: flex; flex-direction: column; gap: 4px; }
.timeline b { color: var(--ink); font-weight: 500; }

/* Team */
.person { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--rule); }
.person:first-child { border-top: 0; }
.p-name { color: var(--ink); font-weight: 500; }
@media (max-width: 640px) { .person { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; } }
.hits { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 10px; background: #fff; overflow: hidden; }
.hit { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: none; border: 0; border-top: 1px solid var(--rule); cursor: pointer; text-align: left; color: var(--ink); }
.hit:first-child { border-top: 0; }
.hit:hover { background: var(--sand-light); }
.hit img { width: 26px; height: 26px; border-radius: 50%; }
.logo-preview { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 22px; display: flex; justify-content: center; }
.logo-preview .logo-img { height: 48px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
@media (min-width: 761px) { .toast { bottom: calc(32px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  return (id) => (!id ? "" : id === P.me ? (P.myName || "You") : (names[id] || "Someone"));
}

/* ============================================================ helpers */
const fmtStamp = (iso) => { if (!iso) return ""; try { return new Date(iso).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } };
const fmtDate = (iso) => { if (!iso) return ""; try { return new Date(iso).toLocaleDateString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; } };
function mergeReports(docs) {
  const m = new Map();
  for (const r of docs) {
    const k = r.store_id + "|" + r.template + "|" + r.period, cur = m.get(k);
    const better = !cur || ((r.status === "submitted") !== (cur.status === "submitted") ? r.status === "submitted" : (r.updated_at || "") > (cur.updated_at || ""));
    if (better) m.set(k, r);
  }
  return [...m.values()];
}
const walkKeys = (answers) => WALK_ZONES.filter(([z]) => ((answers["walk:" + z] || {}).photos || []).length > 0).map(([z]) => z);

async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); showToast(msg || "Copied"); return; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); showToast(msg || "Copied"); } catch (e) { showToast("Select the text and copy it manually."); }
  ta.remove();
}
async function compress(file) {
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), "image/jpeg", 0.8));
  } catch (e) { return null; }
}
async function uploadPhoto(file) {
  if (!P.assets) { showToast("Photo upload needs Contributor access. Ask Founder's Office."); return null; }
  const blob = await compress(file);
  try {
    const r = blob ? await P.assets.upload(blob, { type: "image/jpeg" })
      : await P.assets.upload(file, { type: /^image\/(png|webp|gif|svg\+xml)$/.test(file.type) ? file.type : "image/jpeg" });
    return r.id;
  } catch (e) {
    showToast(e && e.code === "too_large" ? "That photo is too large." : e && e.code === "unsupported_type" ? "Use a JPG, PNG or WebP photo." : "Couldn't upload a photo. Try again.");
    return null;
  }
}
async function uploadMany(files, onEach) {
  const ids = [];
  for (const f of files) { const id = await uploadPhoto(f); if (id) { ids.push(id); onEach && onEach(id); } }
  return ids;
}

}

/* ============================================================ report form */
function ReportView({ ctx, storeId, templateKey, period, owner }) {
  const { now, isAdmin, myStore, canWrite, go, allStores } = ctx;
  const store = allStores.find((s) => s.id === storeId);
  const t = store ? S.getTemplate(templateKey, store) : null;
  const valid = !!(t && S.isValidPeriod(t.frequency, period) && owner);
  const path = valid ? `${repCol(owner)}/${repId(storeId, templateKey, period)}` : null;
  const doc = useDoc(path);
  const scored = valid && t.scored;
  const [ws, we] = valid ? (t.frequency === "weekly" ? S.periodRange("weekly", period) : S.periodRange("weekly", S.periodFor("weekly", now.date))) : ["", ""];
  const weekDays = useMemo(() => (ws ? Array.from({ length: 7 }, (_, i) => S.addDays(ws, i)) : []), [ws]);
  const uids = isAdmin ? ctx.writers : [P.me];
  const wk = useMulti(scored ? `wk:${storeId}:${ws}` : null, uids, (db, uid) => db.collection(repCol(uid)).where("store_id", "==", storeId).where("period", "in", weekDays));
  const wb = useMulti(scored ? `wb:${storeId}:${ws}` : null, uids, (db, uid) => db.collection(breachCol(uid)).where("store_id", "==", storeId).where("date", ">=", ws));

  const [answers, setAnswers] = useState({});
  const [note, setNote] = useState("");
  const [save, setSave] = useState({ state: "idle", at: null });
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [uploading, setUploading] = useState({});
  const status = doc.data ? doc.data.status : null;
  const latest = useRef({}); latest.current = { answers, note };
  const statusRef = useRef(status); statusRef.current = status;
  const timer = useRef(null), pending = useRef(false), persistRef = useRef(null);

  useEffect(() => {
    if (doc.loading) return;
    setAnswers((doc.data && doc.data.answers) || {}); setNote((doc.data && doc.data.note) || "");
    setSave({ state: "idle", at: doc.data && doc.data.updated_at });
  }, [doc.loading, status]);
  useEffect(() => () => { clearTimeout(timer.current); if (pending.current && persistRef.current) persistRef.current(); }, [path]);
  if (!valid) return html`<div class="card pad">That report doesn't exist. <button class="link" onClick=${() => go(null)}>Go back</button></div>`;

  const [start] = S.periodRange(t.frequency, period);
  const notStarted = start > now.date;
  const allowed = canWrite && (isAdmin || (!t.adminOnly && myStore && myStore.id === storeId && owner === P.me));
  const editable = allowed && !notStarted && !doc.loading && status !== "submitted";
  const A = editable ? answers : (doc.data && doc.data.answers) || {};
  const shownNote = editable ? note : (doc.data && doc.data.note) || "";
  const items = S.allItems(t);
  const done = items.filter((i) => A[i.id] && A[i.id].done).length;
  const open = items.length - done;
  const photoMissing = items.filter((i) => i.photo && A[i.id] && A[i.id].done && !(A[i.id].photos || []).length);
  const walkMin = WALK_MIN[t.key] || 0;
  const walkDone = walkKeys(A).length;
  const daily = scored ? S.dailyCompliance(store, mergeReports(wk.docs), ws, we < now.date ? we : now.date) : 1;
  const breachesInWeek = scored ? wb.docs.filter((b) => b.date <= we).length : 0;
  const preview = scored ? S.auditScore(t, A, daily, breachesInWeek) : null;
  const quickOk = t.frequency === "daily" || t.frequency === "weekly" && !t.scored;

  function buildDoc(st) {
    const a = latest.current.answers, n = latest.current.note, iso = new Date().toISOString();
    const d = { store_id: storeId, template: t.key, period, status: st, answers: a, note: n, completion: S.completion(t, a), photo_count: S.photoCount(a),
      score: null, updated_by: P.me, updated_at: iso, submitted_by: null, submitted_at: null };
    if (st === "submitted") { d.submitted_by = P.me; d.submitted_at = iso; if (scored) d.score = S.auditScore(t, a, daily, breachesInWeek).total; }
    return d;
  }
  function persistNow() {
    pending.current = false;
    return enqueue(path, async () => {
      if (statusRef.current === "submitted") return;
      setSave((s) => ({ ...s, state: "saving" }));
      try { await P.db.doc(path).set(buildDoc("draft")); setSave({ state: "saved", at: new Date().toISOString() }); setError(null); }
      catch (e) { console.error(e); setSave((s) => ({ ...s, state: "error" })); setError(errText(e)); }
    });
  }
  persistRef.current = persistNow;
  function schedule() { if (!editable) return; pending.current = true; clearTimeout(timer.current); timer.current = setTimeout(persistNow, 800); }
  function setA(fn) { setAnswers((a) => { const n = fn(a); latest.current.answers = n; return n; }); }
  function patch(id, p) { setA((a) => ({ ...a, [id]: { ...(a[id] || {}), ...p } })); schedule(); }
  function tickAll(sec) { setA((a) => { const n = { ...a }; sec.items.forEach((i) => { n[i.id] = { ...(n[i.id] || {}), done: true }; }); return n; }); schedule(); }
  async function addPhotos(key, files, markDone) {
    setUploading((u) => ({ ...u, [key]: true })); setError(null);
    await uploadMany(files, (aid) => setA((a) => { const cur = a[key] || {}; return { ...a, [key]: { ...cur, ...(markDone ? { done: true } : {}), photos: [...(cur.photos || []), aid] } }; }));
    setUploading((u) => ({ ...u, [key]: false }));
    clearTimeout(timer.current); pending.current = true; setTimeout(persistNow, 0);
  }
  function removePhoto(key, aid) {
    setA((a) => { const cur = a[key] || {}; return { ...a, [key]: { ...cur, photos: (cur.photos || []).filter((p) => p !== aid) } }; });
    schedule();
    if (P.assets) P.assets.delete(aid).catch(() => {});
  }
  async function submit() {
    setError(null);
    if (walkDone < walkMin) { setError(`Add photos of at least ${walkMin} store areas in the photo walk (${walkDone} so far).`); document.getElementById("walk")?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (photoMissing.length) { setError(`${photoMissing.length} ticked item${photoMissing.length > 1 ? "s need" : " needs"} a photo.`); return; }
    if (open > 0 && note.trim().length < 10) { setError(`Explain the ${open} open item${open > 1 ? "s" : ""} in the note before submitting.`); document.getElementById("note")?.focus(); return; }
    setBusy(true); clearTimeout(timer.current); pending.current = false;
    await (queues[path] || Promise.resolve()).catch(() => {});
    try {
      const cur = await P.db.doc(path).get();
      if (cur.exists && cur.data().status === "submitted") { setBusy(false); setError("This report was already submitted."); return; }
      await enqueue(path, () => P.db.doc(path).set(buildDoc("submitted")));
      showToast(`${t.name} submitted`);
      go({ v: "summary", store: storeId, template: t.key, period, owner, fresh: true });
    } catch (e) { console.error(e); setError(errText(e)); }
    setBusy(false);
  }
  async function reopen() {
    setBusy(true);
    try { await enqueue(path, () => P.db.doc(path).update({ status: "draft", updated_by: P.me, updated_at: new Date().toISOString() })); showToast("Reopened for edits"); }
    catch (e) { setError(errText(e)); }
    setBusy(false);
  }
  const due = `${S.fmtDay(S.dueDate(t.frequency, period))}, ${S.dueTimeFor(t, store)}`;
  const totalSteps = items.length + (walkMin ? 1 : 0);
  const stepsDone = done + (walkMin && walkDone >= walkMin ? 1 : 0);

  return html`
    <button class="back" onClick=${() => go(isAdmin ? { v: "store", store: storeId } : null)}><${Icon} n="back" s=${16} />${store.name}</button>
    <section class="report-head">
      <div class="eyebrow">${S.FREQ_LABEL[t.frequency]} · ${S.periodLabel(t.frequency, period)}</div>
      <div class="row between gap8"><h1>${t.name}</h1><${Pill} state=${status === "submitted" ? "submitted" : status ? "draft" : "due"} /></div>
      <p class="muted">${t.description}</p>
      <p class="small muted">Due ${due}</p>
    </section>
    ${notStarted && html`<div class="alert warn">This period hasn't started yet.</div>`}
    ${!allowed && !ctx.preview && status !== "submitted" && html`<div class="alert warn">You can view this checklist but not fill it in.${t.adminOnly ? " Only Founder's Office runs surprise audits." : ""}</div>`}
    ${status === "submitted" && html`<div class="alert good row between gap8">
      <span>Submitted ${fmtStamp(doc.data.submitted_at)}.${doc.data.score != null ? ` Score ${doc.data.score} / 100.` : ""}</span>
      <span class="row gap8">
        <button class="btn sm" onClick=${() => go({ v: "summary", store: storeId, template: t.key, period, owner })}><${Icon} n="doc" s=${16} />A4 summary</button>
        ${isAdmin && canWrite && html`<button class="btn ghost sm" disabled=${busy} onClick=${reopen}>Reopen</button>`}
      </span>
    </div>`}

    ${walkMin > 0 && !doc.loading && html`<section class="card walk" id="walk">
      <div class="list-h"><div><h2>Store photo walk</h2><p class="small muted">Photograph at least ${walkMin} different areas so Founder's Office can see the store is clean. Add as many photos per area as you like.</p></div>
        <span class=${"pill " + (walkDone >= walkMin ? "submitted" : "due")}>${walkDone} of ${walkMin}</span></div>
      <div class="walk-grid">${WALK_ZONES.map(([z, label]) => {
        const key = "walk:" + z, photos = (A[key] || {}).photos || [];
        return html`<div class=${"zone" + (photos.length ? " has" : "")}>
          <div class="zone-h"><span>${label}</span>${photos.length > 0 && html`<span class="zone-n"><${Icon} n="check" s=${14} />${photos.length}</span>`}</div>
          ${photos.length > 0 && html`<div class="thumbs">${photos.map((p) => html`<${Photo} id=${p} caption=${label} onRemove=${editable ? () => removePhoto(key, p) : null} />`)}</div>`}
          ${editable && P.assets && html`<${PhotoPicker} compact=${true} label=${photos.length ? "Add more" : "Add photos"} busy=${uploading[key]} onFiles=${(fs) => addPhotos(key, fs, false)} />`}
        </div>`;
      })}</div>

/* ============================================================ A4 summary + PDF */
function summarize(t, store, d, nameOf) {
  const A = d.answers || {};
  const sections = t.sections.map((sec) => {
    const r = S.sectionResult(sec, A), met = sec.items.length - r.fails;
    const status = r.fails === 0 ? "OK" : sec.strict || r.fails > 2 ? "Fail" : "Attention";
    return { title: sec.title.replace(/^\d+\.\s*/, ""), met, total: sec.items.length, status };
  });
  const openItems = [];
  t.sections.forEach((sec) => sec.items.forEach((it) => { const a = A[it.id] || {}; if (!a.done) openItems.push({ text: it.text, note: a.note || "" }); }));
  const notes = [];
  t.sections.forEach((sec) => sec.items.forEach((it) => { const a = A[it.id] || {}; if (a.done && a.note) notes.push({ text: it.text, note: a.note }); }));
  const walk = WALK_ZONES.flatMap(([z, label]) => ((A["walk:" + z] || {}).photos || []).slice(0, 1).map((id) => ({ id, label })));
  const itemPhotos = [];
  t.sections.forEach((sec) => sec.items.forEach((it) => ((A[it.id] || {}).photos || []).slice(0, 1).forEach((id) => itemPhotos.push({ id, label: it.text }))));
  const items = S.allItems(t), met = items.filter((i) => A[i.id] && A[i.id].done).length;
  const verdict = d.score != null ? (d.score >= 90 ? "Pass" : d.score >= 75 ? "Fix plan within 48 hours" : "Founder's Office audit") : openItems.length ? `${openItems.length} open item${openItems.length > 1 ? "s" : ""}` : "All standards met";
  return {
    title: t.name, store: store.name, freq: S.FREQ_LABEL[t.frequency], periodLabel: S.periodLabel(t.frequency, d.period),
    by: nameOf(d.submitted_by), at: fmtStamp(d.submitted_at), date: fmtDate(d.submitted_at), verdict,
    stats: [
      d.score != null ? { v: String(d.score), k: "Audit score / 100" } : { v: Math.round((d.completion || 0) * 100) + "%", k: "Completion" },
      { v: `${met}/${items.length}`, k: "Standards met" }, { v: String(openItems.length), k: "Open items" }, { v: String(d.photo_count || 0), k: "Photos" },
    ],
    sections, openItems, notes, note: d.note || "", photos: [...walk, ...itemPhotos].slice(0, 6),
  };
}
let jspdfLoading = null;
function loadJsPdf() {
  if (window.jspdf) return Promise.resolve();
  if (!jspdfLoading) jspdfLoading = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
    s.onload = res; s.onerror = () => { jspdfLoading = null; rej(new Error("load")); }; document.head.appendChild(s);
  });
  return jspdfLoading;
}
async function imgData(id, maxPx) {
  try {
    const r = await fetch("/_blob/" + id); if (!r.ok) return null;
    const bmp = await createImageBitmap(await r.blob());
    const sc = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    const g = c.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    return { data: c.toDataURL("image/jpeg", 0.85), w: c.width, h: c.height };
  } catch (e) { return null; }
}
async function buildPdf(sum, logoId) {
  await loadJsPdf();
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({ unit: "mm", format: "a4" });
  const M = 16, R = 194, LIMIT = 280;
  const INK = [43, 43, 43], SOFT = [107, 100, 90], RULE = [226, 219, 208], PAPER = [247, 244, 240], STONE = [140, 128, 112];
  const ST = { OK: [78, 107, 74], Attention: [143, 106, 42], Fail: [148, 68, 58] };
  const col = (c) => d.setTextColor(c[0], c[1], c[2]);
  const font = (f, st, sz) => { d.setFont(f, st); d.setFontSize(sz); };
  let y = M;
  const logo = logoId ? await imgData(logoId, 800) : null;
  if (logo) { const hh = 11, ww = Math.min(70, hh * logo.w / logo.h); d.addImage(logo.data, "JPEG", M, y - 1, ww, hh); }
  else { font("times", "normal", 17); col(INK); d.text("MAGPPIE", M, y + 7, { charSpace: 2.4 }); }
  font("helvetica", "normal", 7.5); col(STONE); d.text("STORE STANDARDS REPORT", R, y + 3.5, { align: "right" });
  col(SOFT); d.text(sum.date, R, y + 8.5, { align: "right" });
  y += 15; d.setDrawColor(...RULE); d.setLineWidth(0.3); d.line(M, y, R, y); y += 11;
  font("times", "normal", 22); col(INK); d.text(sum.title, M, y); y += 7;
  font("helvetica", "normal", 10.5); col(SOFT); d.text(`${sum.store}   ·   ${sum.freq}   ·   ${sum.periodLabel}`, M, y); y += 9;
  const meta = [["SUBMITTED BY", sum.by], ["SUBMITTED ON", sum.at], ["RESULT", sum.verdict]];
  const mw = (R - M) / 3;
  meta.forEach(([k, v], i) => { font("helvetica", "normal", 7); col(STONE); d.text(k, M + i * mw, y, { charSpace: 0.4 }); font("helvetica", "normal", 10); col(INK); d.text(d.splitTextToSize(v || "", mw - 4)[0] || "", M + i * mw, y + 5); });
  y += 11;
  const bw = (R - M - 9) / 4;
  sum.stats.forEach((s, i) => {
    const x = M + i * (bw + 3);
    d.setFillColor(...PAPER); d.setDrawColor(...RULE); d.roundedRect(x, y, bw, 19, 1.5, 1.5, "FD");
    font("times", "bold", 17); col(INK); d.text(s.v, x + 4, y + 9.5);
    font("helvetica", "normal", 7.5); col(SOFT); d.text(s.k, x + 4, y + 15);
  });
  y += 27;
  const rh = sum.sections.length > 8 ? 5.2 : 6.5;
  font("helvetica", "normal", 7); col(STONE); d.text("SECTION", M, y, { charSpace: 0.4 }); d.text("MET", 150, y, { align: "right" }); d.text("STATUS", R, y, { align: "right" });
  y += 2; d.line(M, y, R, y); y += rh - 1.5;
  sum.sections.forEach((s) => {
    font("helvetica", "normal", 9); col(INK); d.text(d.splitTextToSize(s.title, 120)[0], M, y); d.text(`${s.met}/${s.total}`, 150, y, { align: "right" });
    col(ST[s.status]); font("helvetica", "bold", 8.5); d.text(s.status, R, y, { align: "right" });
    y += 1.6; d.setDrawColor(...RULE); d.line(M, y, R, y); y += rh - 1.6;
  });
  y += 3;
  const photoRowH = 40;
  const reserveNote = sum.note ? 16 : 0;
  if (sum.openItems.length || sum.notes.length) {
    font("helvetica", "normal", 7); col(STONE); d.text(sum.openItems.length ? "OPEN ITEMS" : "NOTES ON ITEMS", M, y, { charSpace: 0.4 }); y += 5;
    const list = sum.openItems.length ? sum.openItems : sum.notes;
    const minPhotos = sum.photos.length ? photoRowH + 8 : 0;
    let shown = 0;
    for (const it of list) {
      const line = `${sum.openItems.length ? "•" : "–"}  ${it.text}${it.note ? `: ${it.note}` : ""}`;
      const wrapped = d.splitTextToSize(line, R - M - 4).slice(0, 2);
      if (y + wrapped.length * 4.3 > LIMIT - reserveNote - minPhotos) break;
      font("helvetica", "normal", 9); col(INK); d.text(wrapped, M + 1, y); y += wrapped.length * 4.3 + 0.8; shown++;
    }
    if (shown < list.length) { font("helvetica", "italic", 8.5); col(SOFT); d.text(`+ ${list.length - shown} more in the app`, M + 1, y); y += 5; }
    y += 2;
  }
  if (sum.note) {
    font("helvetica", "normal", 7); col(STONE); d.text("MANAGER'S NOTE", M, y, { charSpace: 0.4 }); y += 5;
    const lines = d.splitTextToSize(sum.note, R - M).slice(0, 3);
    font("helvetica", "normal", 9); col(INK); d.text(lines, M, y); y += lines.length * 4.3 + 4;
  }
  const rows = Math.min(2, Math.floor((LIMIT - y - 6) / (photoRowH + 3)));
  if (sum.photos.length && rows > 0) {
    font("helvetica", "normal", 7); col(STONE); d.text("PHOTOS", M, y, { charSpace: 0.4 }); y += 3;
    const cw = (R - M - 8) / 3, ih = photoRowH - 7;
    const list = sum.photos.slice(0, rows * 3);
    const imgs = await Promise.all(list.map((p) => imgData(p.id, 700)));
    list.forEach((p, i) => {
      const x = M + (i % 3) * (cw + 4), yy = y + Math.floor(i / 3) * (photoRowH + 3);
      d.setFillColor(...PAPER); d.rect(x, yy, cw, ih, "F");
      const im = imgs[i];
      if (im) { const sc = Math.min(cw / im.w, ih / im.h), w = im.w * sc, hh = im.h * sc; d.addImage(im.data, "JPEG", x + (cw - w) / 2, yy + (ih - hh) / 2, w, hh); }
      font("helvetica", "normal", 7.5); col(SOFT); d.text(d.splitTextToSize(p.label, cw)[0], x, yy + ih + 4);
    });
  }
  d.setDrawColor(...RULE); d.line(M, 286, R, 286);
  font("helvetica", "normal", 7); col(SOFT);
  d.text(`Magppie Store Standards  ·  ${sum.store}  ·  ${sum.title}  ·  ${sum.periodLabel}`, M, 290.5);
  d.text("Page 1 of 1", R, 290.5, { align: "right" });
  return d.output("blob");
}

      <div class="sheet-meta"><div><span>Submitted by</span><b>${sum.by}</b></div><div><span>Submitted on</span><b>${sum.at}</b></div><div><span>Result</span><b>${sum.verdict}</b></div></div>

  return html`
    <div class="stack tight"><div class="eyebrow">Founder's Office</div><h1>Settings</h1></div>
    <div class="seg tabs">${[["stores", "Stores"], ["team", "Team"], ["email", "Email and logo"]].map(([k, l]) => html`<button type="button" aria-pressed=${tab === k} onClick=${() => setTab(k)}>${l}</button>`)}</div>
    ${!P.canEdit && !ctx.preview && html`<div class="alert warn">Only people with Editor access to this page can change settings.</div>`}
    ${tab === "stores" ? html`<${StoresAdmin} ctx=${ctx} key=${ctx.storesStamp} />` : tab === "team" ? html`<${TeamAdmin} ctx=${ctx} />` : html`<${EmailLogo} ctx=${ctx} key=${ctx.settingsStamp} />`}`;
}
function StoresAdmin({ ctx }) {
  const { allStores, canWrite } = ctx;
  const [list, setList] = useState(() => allStores.map((s) => ({ ...s })));
  const [dirty, setDirty] = useState(false);
  const [busy, setBusy] = useState(false);
  const [nw, setNw] = useState("");
  const can = canWrite && P.canEdit;
  const upd = (i, p) => { setList((l) => l.map((s, j) => (j === i ? { ...s, ...p } : s))); setDirty(true); };
  async function saveAll(next) {
    const data = next || list;
    for (const s of data) if (!s.name.trim() || !(S.hhmm(s.opens_at) < S.hhmm(s.closes_at))) { showToast(`Check ${s.name || "a store"}: opening must be before closing.`); return; }
    setBusy(true);
    try { await enqueue("config/stores", () => P.db.doc("config/stores").set({ list: data, updated_by: P.me, updated_at: new Date().toISOString() })); setDirty(false); showToast("Stores saved"); }
    catch (e) { showToast(e && e.code === "invalid_argument" ? "Only editors of this page can change stores." : errText(e)); }
    setBusy(false);
  }
  function add(e) {
    e.preventDefault();
    const id = nw.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    if (!id) return;
    if (list.some((s) => s.id === id)) { showToast("A store with that name already exists."); return; }
    const next = [...list, { id, name: nw.trim(), city: null, opens_at: "10:30", closes_at: "19:30", weekly_off: null, go_live: S.nowIST().date, active: true }];
    setList(next); setNw(""); saveAll(next);
  }
  return html`
    <p class="muted">Hours set the due times: opening check by opening time, closing check and washroom log within an hour of closing. Daily checks aren't expected on the weekly off. Reports only count as overdue from each store's start date.</p>
    ${list.map((s, i) => html`<section class="card pad stack">
      <div class="row between"><h3>${s.name || "New store"}</h3>
        <label class="switch small"><input id=${"sa-" + s.id} type="checkbox" checked=${s.active !== false} disabled=${!can} onChange=${(e) => upd(i, { active: e.currentTarget.checked })} /> Active</label></div>
      <div class="form-grid">
        <label class="f">Name<input id=${"sn-" + s.id} type="text" value=${s.name} disabled=${!can} onInput=${(e) => upd(i, { name: e.currentTarget.value })} /></label>
        <label class="f">Opens<input id=${"so-" + s.id} type="time" value=${S.hhmm(s.opens_at)} disabled=${!can} onInput=${(e) => upd(i, { opens_at: e.currentTarget.value })} /></label>
        <label class="f">Closes<input id=${"sx-" + s.id} type="time" value=${S.hhmm(s.closes_at)} disabled=${!can} onInput=${(e) => upd(i, { closes_at: e.currentTarget.value })} /></label>
        <label class="f">Weekly off<select id=${"sw-" + s.id} value=${s.weekly_off == null ? "" : String(s.weekly_off)} disabled=${!can} onChange=${(e) => upd(i, { weekly_off: e.currentTarget.value === "" ? null : Number(e.currentTarget.value) })}>
          <option value="">Open all week</option>${DAYS.map((d, k) => html`<option value=${String(k)}>${d}</option>`)}</select></label>
        <label class="f">Reports count from<input id=${"sg-" + s.id} type="date" value=${s.go_live} disabled=${!can} onInput=${(e) => upd(i, { go_live: e.currentTarget.value })} /></label>
      </div></section>`)}
    ${can && html`<form class="card pad row gap8" onSubmit=${add}><input id="ns-name" type="text" required value=${nw} placeholder="New store name" style="flex:1;min-width:180px" onInput=${(e) => setNw(e.currentTarget.value)} /><button class="btn ghost" type="submit"><${Icon} n="plus" s=${16} />Add store</button></form>`}
    ${can && html`<div class="submit-bar"><div class="wrap submit-in"><span class="saving">${dirty ? "Unsaved changes" : "All changes saved"}</span><button class="btn" disabled=${busy || !dirty} onClick=${() => saveAll()}>Save stores</button></div></div>`}`;
}
function TeamAdmin({ ctx }) {
  const { members, allStores, canWrite } = ctx;
  const ids = Object.keys(members);
  const names = useNames(ids);
  const can = canWrite && P.canEdit;
  const [q, setQ] = useState("");
  const [hits, setHits] = useState([]);
  const [pick, setPick] = useState(null);
  const [role, setRole] = useState("store_manager");
  const [store, setStore] = useState(allStores[0] ? allStores[0].id : "");
  async function search(v) { setQ(v); if (!P.user) return; setHits(await P.user.search(v)); }
  async function write(nextMembers, okMsg) {
    try { await enqueue("config/team", () => P.db.doc("config/team").set({ ...(ctx.teamDoc || {}), members: nextMembers, updated_by: P.me, updated_at: new Date().toISOString() })); showToast(okMsg); }
    catch (e) { showToast(e && e.code === "invalid_argument" ? "Only editors of this page can change the team." : errText(e)); }
  }
  function add(e) {
    e.preventDefault();
    if (!pick) { showToast("Search for a person and pick them first."); return; }
    write({ ...members, [pick.id]: { role, store: role === "store_manager" ? store : null, active: true } }, `${pick.name} added`);
    setPick(null); setQ(""); setHits([]);
  }
  const sorted = ids.filter((id) => members[id].active !== false).sort((a, b) => (members[a].role === members[b].role ? names(a).localeCompare(names(b)) : members[a].role === "admin" ? -1 : 1));
  const former = ids.filter((id) => members[id].active === false);
  return html`
    <div class="band small stack" style="gap:6px"><b>Two steps for each person</b>
      <span>1. Share this page with them from the Share menu. Store Managers get <b>Contributor</b> (they can submit and upload photos). Founder's Office and AVPs get <b>Editor</b> (they can see every store and change settings).</span>
      <span>2. Add them below with their role and store. Store Managers only ever see their own submissions.</span></div>
    ${can && html`<form class="card pad stack" onSubmit=${add}><h3>Add a person</h3>
      <label class="f">Search your organisation<input id="t-search" type="text" value=${q} placeholder="Name or email" autocomplete="off" onFocus=${() => search(q)} onInput=${(e) => search(e.currentTarget.value)} /></label>
      ${pick ? html`<div class="row gap8"><span class="pill submitted">${pick.name}</span><button type="button" class="link small" onClick=${() => setPick(null)}>Change</button></div>`
        : hits.length > 0 && html`<div class="hits">${hits.map((p) => html`<button type="button" class="hit" onClick=${() => { setPick({ id: p.id, name: p.name }); setHits([]); }}><img src=${p.avatarUrl} alt="" /><span>${p.name}</span></button>`)}</div>`}
      <div class="form-grid">
        <label class="f">Role<select id="t-role" value=${role} onChange=${(e) => setRole(e.currentTarget.value)}><option value="store_manager">Store Manager</option><option value="admin">Founder's Office / AVP</option></select></label>
        ${role === "store_manager" && html`<label class="f">Store<select id="t-store" value=${store} onChange=${(e) => setStore(e.currentTarget.value)}>${allStores.map((s) => html`<option value=${s.id}>${s.name}</option>`)}</select></label>`}
        <button class="btn" type="submit">Add</button>
      </div></form>`}
    <section class="card list">
      ${sorted.length === 0 && html`<p class="pad muted">No one added yet. As the page owner you are Founder's Office.</p>`}
      ${sorted.map((id) => { const m = members[id]; return html`<div class="person">
        <span class="p-name">${names(id)}</span>
        ${can ? html`<select id=${"tr-" + id} value=${m.role} onChange=${(e) => write({ ...members, [id]: { ...m, role: e.currentTarget.value, store: e.currentTarget.value === "admin" ? null : m.store || (allStores[0] && allStores[0].id) } }, "Role updated")}>
            <option value="store_manager">Store Manager</option><option value="admin">Founder's Office / AVP</option></select>` : html`<span>${m.role === "admin" ? "Founder's Office / AVP" : "Store Manager"}</span>`}
        ${m.role === "store_manager" ? (can ? html`<select id=${"ts-" + id} value=${m.store} onChange=${(e) => write({ ...members, [id]: { ...m, store: e.currentTarget.value } }, "Store updated")}>${allStores.map((s) => html`<option value=${s.id}>${s.name}</option>`)}</select>` : html`<span>${(allStores.find((s) => s.id === m.store) || {}).name || ""}</span>`) : html`<span class="muted">All stores</span>`}
        ${can && html`<button class="link small" onClick=${() => write({ ...members, [id]: { ...m, active: false } }, "Removed. Their past reports stay visible.")}>Remove</button>`}
      </div>`; })}
    </section>
    ${former.length > 0 && html`<p class="small muted">${former.length} former member${former.length > 1 ? "s" : ""}: their past reports stay visible to Founder's Office. ${can && html`<button class="link small" onClick=${() => write(Object.fromEntries(Object.entries(members).map(([k, v]) => [k, v.active === false ? { ...v, active: true } : v])), "Restored")}>Restore all</button>`}</p>`}`;
}
function EmailLogo({ ctx }) {
  const { settings, canWrite } = ctx;
  const can = canWrite && P.canEdit;
  const [f, setF] = useState({ reportRecipients: settings.reportRecipients || "", upkeepRecipients: settings.upkeepRecipients || "" });
  const [logo, setLogo] = useState(settings.logo || null);
  const [up, setUp] = useState(false);
  const [busy, setBusy] = useState(false);
  async function save(nextLogo) {
    setBusy(true);
    try { await enqueue("config/settings", () => P.db.doc("config/settings").set({ ...f, logo: nextLogo === undefined ? logo : nextLogo, updated_by: P.me, updated_at: new Date().toISOString() })); showToast("Saved"); }
    catch (e) { showToast(e && e.code === "invalid_argument" ? "Only editors of this page can change settings." : errText(e)); }
    setBusy(false);
  }
  async function pickLogo(fs) {
    const file = fs[0]; if (!file || !P.assets) return;
    setUp(true);
    try {
      const type = /^image\/(png|webp|svg\+xml|jpeg)$/.test(file.type) ? file.type : "image/png";
      const r = await P.assets.upload(file, { type });
      setLogo(r.id); await save(r.id);
    } catch (e) { showToast("Couldn't upload the logo. Use a PNG, JPG or SVG under 2 MB."); }
    setUp(false);
  }
  return html`
    <section class="card pad stack"><h3>Email recipients</h3>
      <p class="small muted">These fill the "To" line when a manager emails a report or an upkeep request. Separate addresses with commas.</p>
      <label class="f">Store reports go to<input id="e-rep" type="text" value=${f.reportRecipients} disabled=${!can} placeholder="avp@magppie.com, founders.office@magppie.com" onInput=${(e) => setF({ ...f, reportRecipients: e.currentTarget.value })} /></label>
      <label class="f">Upkeep requests go to<input id="e-upk" type="text" value=${f.upkeepRecipients} disabled=${!can} placeholder="founders.office@magppie.com, facilities@magppie.com" onInput=${(e) => setF({ ...f, upkeepRecipients: e.currentTarget.value })} /></label>
      ${can && html`<div><button class="btn" disabled=${busy} onClick=${() => save()}>Save recipients</button></div>`}
    </section>
    <section class="card pad stack"><h3>Logo</h3>
      <p class="small muted">Upload Magppie's official logo (PNG with a transparent background or SVG works best). It appears in the header and on every A4 report.</p>
      <div class="logo-preview"><${Logo} settings=${{ logo }} /></div>
      ${can && html`<div class="row gap8 wrap">
        <label class="btn ghost">${up ? "Uploading…" : logo ? "Replace logo" : "Upload logo"}<input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden disabled=${up} onChange=${(e) => { const fs = [...(e.currentTarget.files || [])]; e.currentTarget.value = ""; pickLogo(fs); }} /></label>
        ${logo && html`<button class="link small" onClick=${() => { setLogo(null); save(null); }}>Use the wordmark instead</button>`}
      </div>`}
    </section>`;
}

/* ============================================================ app */
function NotSetUp() {
  return html`<section class="hero card"><div class="eyebrow">Magppie Store Standards</div><h1>You're not set up yet</h1>
    <p class="muted">Signed in as ${P.myName || "you"}. Founder's Office adds each Store Manager and assigns their store. Once that's done, reopen this page and your store's checklists will be here.</p></section>`;
}
function Toast() {
  const [t, setT] = useState(null);
  const timer = useRef(null);
  showToast = (m) => { setT(m); clearTimeout(timer.current); timer.current = setTimeout(() => setT(null), 3000); };
  return t ? html`<div class="toast" role="status">${t}</div>` : null;
}
function Main() {
  const now = useNow();
  const team = useDoc("config/team");
  const storesDoc = useDoc("config/stores");
  const settingsDoc = useDoc("config/settings");
  const [view, setView] = useState(null);
  useEffect(() => { try { window.scrollTo(0, 0); } catch (e) {} }, [view]);

  // The owner records their id once, so other Founder's Office members can see what the owner submits
  useEffect(() => {
    if (!P.db || !P.isOwner || team.loading || !P.me) return;
    if (team.data && team.data.owner === P.me) return;
    P.db.doc("config/team").set({ ...(team.data || { members: {} }), owner: P.me }).catch((e) => console.error(e));
  }, [team.loading, team.data && team.data.owner]);

  const preview = !P.db;
  const allStores = storesDoc.data && storesDoc.data.list && storesDoc.data.list.length ? storesDoc.data.list : DEFAULT_STORES;
  const stores = allStores.filter((s) => s.active !== false);
  const members = (team.data && team.data.members) || {};
  const member = P.me ? members[P.me] : null;
  const activeMember = member && member.active !== false ? member : null;
  const isAdmin = preview || P.isOwner || (activeMember && activeMember.role === "admin");
  const myStore = !isAdmin && activeMember && activeMember.role === "store_manager" ? allStores.find((s) => s.id === activeMember.store) || null : null;
  const canWrite = !preview && !!P.me && P.canWrite !== false;
  const writers = useMemo(() => [...new Set([...Object.keys(members), team.data && team.data.owner, P.me].filter(Boolean))].sort(), [Object.keys(members).join(","), team.data && team.data.owner]);
  const settings = settingsDoc.data || {};
  const ctx = { now, stores, allStores, members, teamDoc: team.data, isAdmin, myStore, canWrite, preview, go: setView, view, writers, settings,
    storesStamp: (storesDoc.data && storesDoc.data.updated_at) || "d", settingsStamp: (settingsDoc.data && settingsDoc.data.updated_at) || "d" };

  if (!preview && (team.loading || storesDoc.loading)) return html`<${Shell} ctx=${ctx}><div class="card pad muted">Loading…</div><//>`;
  if (!isAdmin && !myStore) return html`<${Shell} ctx=${ctx}><${NotSetUp} /><//>`;

  const v = view || (isAdmin ? { v: "dash" } : { v: "home" });
  const sid = (x) => (isAdmin ? x : myStore.id);
  const own = (o) => (isAdmin ? o || P.me : P.me);
  let body;
  switch (v.v) {
    case "store": { const st = isAdmin ? allStores.find((s) => s.id === v.store) : myStore; body = st ? html`<${StoreHome} key=${st.id} ctx=${ctx} store=${st} />` : html`<${Dashboard} ctx=${ctx} />`; break; }
    case "report": body = html`<${ReportView} key=${[v.store, v.template, v.period, v.owner].join("|")} ctx=${ctx} storeId=${sid(v.store)} templateKey=${v.template} period=${v.period} owner=${own(v.owner)} />`; break;
    case "summary": body = html`<${Summary} key=${[v.store, v.template, v.period, v.owner].join("|")} ctx=${ctx} storeId=${sid(v.store)} templateKey=${v.template} period=${v.period} owner=${own(v.owner)} fresh=${!!v.fresh} />`; break;
    case "upkeep": body = html`<${Upkeep} ctx=${ctx} />`; break;
    case "breach": body = isAdmin ? html`<${BreachesAdmin} ctx=${ctx} />` : html`<${BreachSM} ctx=${ctx} />`; break;
    case "breaches": body = isAdmin ? html`<${BreachesAdmin} ctx=${ctx} />` : html`<${BreachSM} ctx=${ctx} />`; break;
    case "reports": body = isAdmin ? html`<${ReportsLog} ctx=${ctx} />` : html`<${StoreHome} ctx=${ctx} store=${myStore} />`; break;
    case "settings": body = isAdmin ? html`<${Settings} ctx=${ctx} />` : html`<${StoreHome} ctx=${ctx} store=${myStore} />`; break;
    default: body = isAdmin ? html`<${Dashboard} ctx=${ctx} />` : html`<${StoreHome} ctx=${ctx} store=${myStore} />`;
  }
  return html`<${Shell} ctx=${ctx}>${body}<//>`;
}
function App() {
  const [ready, setReady] = useState(false);
  useEffect(() => { initPlatform().catch((e) => console.error(e)).finally(() => setReady(true)); }, []);
  return html`${ready ? html`<${Main} />` : html`<header class="top"><div class="wrap top-in"><span class="brand"><span class="wordmark">MAGPPIE</span><span class="brand-sub">Store Standards</span></span></div></header><main class="wrap page"><div class="card pad muted">Loading…</div></main>`}<${Toast} />`;
}
render(html`<${App} />`, document.getElementById("app"));

</script>

</body></html>
